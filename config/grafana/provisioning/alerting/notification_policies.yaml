apiVersion: 1
policies:
  - orgId: 1
    receiver: slack-contact
    group_by: ['...']
    matchers:
      - severity = warning
    group_wait: 2m
    group_interval: 10m
    repeat_interval: 4h

  - orgId: 1
    receiver: slack-contact
    group_by: ['...']
    matchers:
      - severity = critical
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 1h
