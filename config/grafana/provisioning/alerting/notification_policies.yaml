apiVersion: 1
policies:
  - orgId: 1
    receiver: slack-contact
    group_by: []
    matchers:
      - severity = warning
    group_wait: 1m
    group_interval: 5m
    repeat_interval: 4h

  - orgId: 1
    receiver: slack-contact
    group_by: []
    matchers:
      - severity = critical
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 1h
